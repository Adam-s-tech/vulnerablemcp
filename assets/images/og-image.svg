      <stop offset="0%" stop-color="#1C2D5A"/>
      <stop offset="50%" stop-color="#3E63DD"/>
      <stop offset="100%" stop-color="#1C2D5A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="16" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Shield icon -->
  <text x="600" y="220" text-anchor="middle" font-size="80" fill="rgba(255,255,255,0.9)">&#x1F6E1;</text>
  <!-- Title -->
